<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8b1a1a">
<title>秦鸣 & 何伟丽｜婚礼答谢宴</title>

<meta name="description" content="秦鸣 & 何伟丽诚挚邀请您参加婚礼答谢宴。2026年10月6日 11:30，杭州和达希尔顿逸林酒店 会议厅M4。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://91qin.github.io/marry/">
<meta property="og:site_name" content="婚礼答谢宴邀请函">
<meta property="og:title" content="秦鸣 & 何伟丽 · 2026.10.06 邀请函">
<meta property="og:description" content="诚邀您参加我们的婚礼答谢宴，一起分享这份喜悦。">
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/91qin/marry@main/assets/share.jpg?v=4">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="600">
<meta itemprop="image" content="https://cdn.jsdelivr.net/gh/91qin/marry@main/assets/share.jpg?v=4">

<link rel="preload" href="assets/6.jpg" as="image" fetchpriority="high">

<style>
:root{--red:#8b1a1a;--red-deep:#5c1010;--gold:#c9a96e;--cream:#faf6f1;--cream2:#f4ede4;--text:#4a3f38;--muted:#9a8778}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Noto Serif SC","Songti SC",serif;color:var(--text);background:var(--cream);overflow-x:hidden;-webkit-font-smoothing:antialiased}

.music{position:fixed;right:14px;top:14px;z-index:300;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;cursor:pointer}
.music.playing{animation:spin 4s linear infinite;background:rgba(139,26,26,.85)}
.music.paused{opacity:.5}
.music.paused::after{content:'';position:absolute;width:2px;height:20px;background:#fff;transform:rotate(45deg)}

/* 第1页：封面 */
.hero{min-height:100svh;position:relative;overflow:hidden;display:flex;align-items:flex-end;background:var(--red-deep)}
.hero-bg{position:absolute;inset:-10%;width:120%;height:120%}
.hero-bg img{width:100%;height:100%;object-fit:cover;animation:heroPan 24s ease-in-out infinite alternate;will-change:transform;opacity:0;transition:opacity .5s ease}
.hero-bg img.loaded{opacity:1}
.hero-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(50,8,8,.05) 0%,rgba(50,8,8,.4) 50%,rgba(20,3,3,.92) 100%)}
.hero-content{position:relative;z-index:2;width:100%;padding:0 28px 90px;text-align:center;color:#fff}
.hero-en{font-size:10px;letter-spacing:10px;opacity:.75;margin-bottom:18px}
.hero h1{font-size:33px;font-weight:400;letter-spacing:5px;line-height:1.65;text-shadow:0 2px 24px rgba(0,0,0,.4)}
.hero-names{font-size:21px;letter-spacing:7px;margin:18px 0 16px}
.hero-date{font-family:Georgia,serif;font-size:13px;letter-spacing:5px;opacity:.8}
.hero-hint{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:3;font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.45);animation:bob 2.5s ease-in-out infinite;white-space:nowrap}

/* 第2页：照片全屏滑动 */
.gallery-page{height:100svh;min-height:100svh;position:relative;background:#000;overflow:hidden}
.gallery-head{position:absolute;top:0;left:0;right:0;z-index:10;padding:max(48px,env(safe-area-inset-top)) 0 24px;text-align:center;color:#fff;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,transparent 100%)}
.gallery-head h2{font-size:20px;font-weight:400;letter-spacing:6px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.gallery-head p{font-size:10px;letter-spacing:4px;opacity:.55;margin-top:6px}
.gallery-track{display:flex;height:100svh;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.gallery-track::-webkit-scrollbar{display:none}
.gallery-slide{flex:0 0 100%;width:100%;height:100svh;scroll-snap-align:start;position:relative;background:#1a0505;overflow:hidden;display:flex;align-items:center;justify-content:center}
.gallery-bg{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(26px) brightness(.42) saturate(1.15);transform:scale(1.08);opacity:0;transition:opacity .4s ease}
.gallery-main{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .4s ease}
.gallery-slide img.loaded{opacity:1}
.gallery-count{position:absolute;bottom:max(52px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.55);z-index:10;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.gallery-dots{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:4px;flex-wrap:wrap;max-width:92%;margin:0 auto;z-index:10}
.gallery-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .3s}
.gallery-dot.on{width:14px;border-radius:3px;background:var(--gold)}

/* 通用 */
.section{padding:56px 22px}
.section-inner{max-width:520px;margin:0 auto}
.section-tag{font-size:10px;letter-spacing:6px;color:var(--gold);text-align:center;margin-bottom:8px}
.section-title{font-size:24px;font-weight:400;letter-spacing:5px;text-align:center;color:var(--red-deep);margin-bottom:24px}
.divider{width:36px;height:1px;background:var(--gold);margin:0 auto 24px}
.invite-text{text-align:center;line-height:2.2;font-size:15px;color:#5c4e44}
.invite-sign{margin-top:24px;font-size:14px;letter-spacing:4px;color:var(--red)}

/* 时间地点 */
.info-section{background:var(--cream2)}
.info-card{border:1px solid rgba(140,112,90,.15);background:#fff}
.info-row{display:flex;gap:14px;padding:15px 18px;border-bottom:1px solid rgba(140,112,90,.1)}
.info-row:last-child{border-bottom:0}
.info-label{width:52px;flex-shrink:0;font-size:12px;color:var(--muted);letter-spacing:2px;padding-top:2px}
.info-value{font-size:15px;line-height:1.65}
.info-value strong{color:var(--red)}
.map-box{margin-top:18px;border-radius:4px;overflow:hidden;border:1px solid rgba(140,112,90,.15)}
.map-box iframe{display:block;width:100%;height:230px;border:0}
.map-actions{display:flex;gap:10px;margin-top:12px}
.map-btn{flex:1;display:flex;align-items:center;justify-content:center;padding:14px 8px;background:var(--red);color:#fff;text-decoration:none;font-size:13px;letter-spacing:2px;border-radius:2px}
.map-btn.secondary{background:#fff;color:var(--red);border:1px solid var(--red)}

/* 回执确认（最后一页） */
.rsvp-section{background:var(--cream);padding-bottom:72px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:7px}
input,select,textarea{width:100%;border:1px solid rgba(140,112,90,.22);background:#fff;padding:14px;border-radius:2px;font-family:inherit;font-size:15px;color:var(--text);outline:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
textarea{min-height:76px;resize:none}
.btn-submit{width:100%;border:0;background:var(--red);color:#fff;padding:16px;font-family:inherit;font-size:14px;letter-spacing:4px;border-radius:2px;margin-top:4px}
.btn-submit:disabled{opacity:.5}
.form-note{font-size:12px;color:var(--muted);text-align:center;line-height:1.8;margin-top:14px}
.rsvp-thanks{text-align:center;margin-top:36px;padding-top:28px;border-top:1px solid rgba(140,112,90,.12)}
.rsvp-thanks p{font-size:22px;letter-spacing:5px;color:var(--red-deep);line-height:1.8}
.rsvp-thanks span{font-size:12px;color:var(--muted);letter-spacing:3px;display:block;margin-top:12px}
#countFields{display:none}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(30,10,10,.9);color:#fff;padding:14px 26px;border-radius:4px;font-size:14px;z-index:400;transition:transform .4s;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.fade{opacity:0;transform:translateY(16px);transition:opacity .75s ease,transform .75s ease}
.fade.show{opacity:1;transform:none}

@keyframes heroPan{
  0%{transform:scale(1.06) translate(0,0)}
  25%{transform:scale(1.12) translate(-3%,-2%)}
  50%{transform:scale(1.1) translate(2%,1%)}
  75%{transform:scale(1.14) translate(-1.5%,2.5%)}
  100%{transform:scale(1.08) translate(1%,-1%)}
}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(7px)}}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:380px){.hero h1{font-size:28px}.hero-names{font-size:18px}}
</style>
</head>
<body>

<audio id="bgm" loop preload="auto" playsinline webkit-playsinline src="assets/music.mp3"></audio>
<button class="music playing" id="musicBtn" aria-label="关闭音乐">♪</button>
<div class="toast" id="toast"></div>

<!-- ① 封面：第6张，背景自动缓动 -->
<section class="hero">
  <div class="hero-bg"><img id="coverImg" src="assets/6.jpg" alt="" fetchpriority="high" decoding="async"></div>
  <div class="hero-mask"></div>
  <div class="hero-content">
    <div class="hero-en">WEDDING INVITATION</div>
    <h1>敬邀您来赴一场<br>迟到的婚宴</h1>
    <div class="hero-names">秦鸣 · 何伟丽</div>
    <div class="hero-date">2026 · 10 · 06</div>
  </div>
  <div class="hero-hint">↓ 向下滑动</div>
</section>

<!-- ② 全部17张照片：左右滑动 -->
<section class="gallery-page">
  <div class="gallery-head">
    <h2>我们的故事</h2>
    <p>左右滑动 · 浏览照片</p>
  </div>
  <div class="gallery-track" id="galleryTrack"></div>
  <div class="gallery-count" id="galleryCount">1 / 17</div>
  <div class="gallery-dots" id="galleryDots"></div>
</section>

<!-- ③ 邀请词 -->
<section class="section" style="background:var(--cream)">
  <div class="section-inner fade">
    <div class="section-tag">INVITATION</div>
    <h2 class="section-title">想与你分享</h2>
    <div class="divider"></div>
    <div class="invite-text">
      <p>我们的幸福，想与你分享。</p>
      <p>特设一场简单的婚礼答谢宴，<br>诚邀你来吃顿饭、聊聊天，<br>一起分享这份喜悦。</p>
      <div class="invite-sign">秦鸣 &amp; 何伟丽 敬邀</div>
    </div>
  </div>
</section>

<!-- ④ 时间地点 + 地图导航 -->
<section class="section info-section">
  <div class="section-inner fade">
    <div class="section-tag">DETAILS</div>
    <h2 class="section-title">宴会信息</h2>
    <div class="divider"></div>
    <div class="info-card" id="infoCard"></div>
    <div class="map-box">
      <iframe id="mapFrame" title="酒店位置" loading="lazy"></iframe>
    </div>
    <div class="map-actions">
      <a class="map-btn" id="navAmap" href="#">📍 高德导航</a>
      <a class="map-btn secondary" id="navTencent" href="#">腾讯导航</a>
    </div>
  </div>
</section>

<!-- ⑤ 回执确认（最后一页） -->
<section class="section rsvp-section">
  <div class="section-inner fade">
    <div class="section-tag">RSVP</div>
    <h2 class="section-title">回执确认</h2>
    <div class="divider"></div>
    <form id="rsvpForm">
      <div class="form-group"><label>您的姓名</label><input name="name" placeholder="请输入姓名" required></div>
      <div class="form-group">
        <label>是否到场</label>
        <select name="attendance" id="attendance" required>
          <option value="">请选择</option>
          <option value="到场">很高兴，到场赴宴</option>
          <option value="无法到场">很遗憾，无法到场</option>
        </select>
      </div>
      <div id="countFields">
        <div class="form-group">
          <label>到场人数（含本人）</label>
          <input name="guest_count" type="number" min="1" max="20" value="1">
        </div>
        <div class="form-group">
          <label>儿童人数（选填，不含本人）</label>
          <input name="child_count" type="number" min="0" max="10" value="0">
        </div>
      </div>
      <div class="form-group"><label>留言（选填）</label><textarea name="message" placeholder="想对我们说的话"></textarea></div>
      <button type="submit" class="btn-submit" id="submitBtn">确认提交</button>
      <div class="form-note">提交后我们会根据登记信息提前安排席位</div>
    </form>
    <div class="rsvp-thanks">
      <p>感谢相遇<br>期待相聚</p>
      <span>秦鸣 &amp; 何伟丽 · 2026.10.06</span>
    </div>
  </div>
</section>

<script src="config.js"></script>
<script>
const cfg = window.MARRY_CONFIG || {};
const venue = cfg.venue || {};
const photoCount = cfg.photoCount || 17;
const assetVer = cfg.assetVersion ? `?v=${cfg.assetVersion}` : '';
const assetBase = cfg.assetBase || (/github\.io$/i.test(location.hostname)
  ? 'https://cdn.jsdelivr.net/gh/91qin/marry@main'
  : '');
function asset(path) {
  const p = path.replace(/^\//, '');
  return assetBase ? `${assetBase}/${p}${assetVer}` : `${p}${assetVer}`;
}

/* 封面 & 音乐走 CDN */
const coverImg = document.getElementById('coverImg');
coverImg.src = asset('assets/6.jpg');
const bgmEl = document.getElementById('bgm');
bgmEl.src = asset('assets/music.mp3');
function onImgLoaded(img) { img.classList.add('loaded'); }
if (coverImg.complete) onImgLoaded(coverImg);
else coverImg.onload = () => onImgLoaded(coverImg);

/* 生成照片滑动（懒加载，滑到才加载） */
const track = document.getElementById('galleryTrack');
const dotsEl = document.getElementById('galleryDots');
const countEl = document.getElementById('galleryCount');
const galleryImgs = [];

for (let i = 1; i <= photoCount; i++) {
  const slide = document.createElement('div');
  slide.className = 'gallery-slide';
  const src = asset(`assets/${i}.jpg`);

  const bg = document.createElement('img');
  bg.className = 'gallery-bg';
  bg.alt = '';
  bg.setAttribute('aria-hidden', 'true');
  bg.dataset.src = src;

  const img = document.createElement('img');
  img.className = 'gallery-main';
  img.dataset.src = src;
  img.alt = `照片 ${i}`;
  img.decoding = 'async';
  img.onload = () => { img.classList.add('loaded'); bg.classList.add('loaded'); };

  slide.appendChild(bg);
  slide.appendChild(img);
  track.appendChild(slide);
  galleryImgs.push({ main: img, bg });

  const dot = document.createElement('div');
  dot.className = 'gallery-dot' + (i === 1 ? ' on' : '');
  dotsEl.appendChild(dot);
}

function loadGalleryImg(pair) {
  if (!pair || !pair.main.dataset.src || pair.main.dataset.loaded) return;
  pair.main.dataset.loaded = '1';
  pair.main.src = pair.main.dataset.src;
  pair.bg.src = pair.bg.dataset.src;
}

/* 首张立即加载，其余滑到附近再加载 */
loadGalleryImg(galleryImgs[0]);
loadGalleryImg(galleryImgs[1]);

const imgLoader = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) loadGalleryImg(galleryImgs[+e.target.dataset.idx]); });
}, { root: track, rootMargin: '50px', threshold: 0.01 });
galleryImgs.forEach((pair, i) => { pair.main.dataset.idx = i; imgLoader.observe(pair.main); });

const dots = dotsEl.querySelectorAll('.gallery-dot');
function updateGallery() {
  const w = track.offsetWidth || 1;
  const idx = Math.min(Math.max(Math.round(track.scrollLeft / w), 0), photoCount - 1);
  countEl.textContent = `${idx + 1} / ${photoCount}`;
  dots.forEach((d, j) => d.classList.toggle('on', j === idx));
  loadGalleryImg(galleryImgs[idx]);
  if (idx + 1 < photoCount) loadGalleryImg(galleryImgs[idx + 1]);
}
track.addEventListener('scroll', updateGallery, { passive: true });

/* 宴会信息 */
document.getElementById('infoCard').innerHTML = `
  <div class="info-row"><div class="info-label">日期</div><div class="info-value">${venue.date || '2026年10月6日（星期二）'}</div></div>
  <div class="info-row"><div class="info-label">开席</div><div class="info-value"><strong>${venue.time || '11:30 开席'}</strong></div></div>
  <div class="info-row"><div class="info-label">酒店</div><div class="info-value">${venue.name || '杭州和达希尔顿逸林酒店'}</div></div>
  <div class="info-row"><div class="info-label">厅房</div><div class="info-value"><strong>${venue.hall || '会议厅 M4'}</strong></div></div>
  <div class="info-row"><div class="info-label">地址</div><div class="info-value">${venue.address || '杭州市钱塘区金沙大道600号'}</div></div>`;

const lat = venue.lat || 30.311908, lng = venue.lng || 120.323939;
const vName = encodeURIComponent(venue.name || '杭州和达希尔顿逸林酒店');
const vAddr = encodeURIComponent(venue.address || '杭州市钱塘区金沙大道600号');

document.getElementById('mapFrame').src =
  `https://apis.map.qq.com/tools/poimarker?type=0&marker=coord:${lat},${lng};title:${vName};addr:${vAddr}&key=OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77&referer=marry`;
document.getElementById('navAmap').href =
  `https://uri.amap.com/marker?position=${lng},${lat}&name=${vName}&callnative=1`;
document.getElementById('navTencent').href =
  `https://apis.map.qq.com/uri/v1/marker?marker=coord:${lat},${lng};title:${vName};addr:${vAddr}&referer=marry`;

/* 滚动淡入 */
document.querySelectorAll('.fade').forEach(el => {
  new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('show'); }), { threshold: .1 }).observe(el);
});

/* 音乐：进入默认播放（微信需一次触摸，会自动重试） */
const bgm = bgmEl, musicBtn = document.getElementById('musicBtn');
let playing = true, musicBooted = false;
bgm.volume = 0.75;

function setMusicUI(on) {
  playing = on;
  musicBtn.classList.toggle('playing', on);
  musicBtn.classList.toggle('paused', !on);
  musicBtn.setAttribute('aria-label', on ? '关闭音乐' : '开启音乐');
}

function tryPlay() {
  if (!playing) return;
  const p = bgm.play();
  if (p) p.then(() => { setMusicUI(true); musicBooted = true; }).catch(() => setMusicUI(false));
}

function bootMusic() {
  if (musicBooted || !playing) return;
  tryPlay();
}

bgm.addEventListener('error', () => { setMusicUI(false); toast('音乐文件未找到，请确认已上传 music.mp3'); });

musicBtn.onclick = e => {
  e.stopPropagation();
  if (playing) { bgm.pause(); setMusicUI(false); }
  else { playing = true; tryPlay(); }
};

document.addEventListener('WeixinJSBridgeReady', () => {
  bootMusic();
  if (typeof WeixinJSBridge !== 'undefined') WeixinJSBridge.invoke('getNetworkType', {}, bootMusic);
}, false);
['canplay', 'canplaythrough'].forEach(ev => bgm.addEventListener(ev, bootMusic));
document.addEventListener('DOMContentLoaded', bootMusic);
window.addEventListener('load', bootMusic);
document.addEventListener('visibilitychange', () => { if (!document.hidden) bootMusic(); });
document.body.addEventListener('touchstart', bootMusic, { passive: true });
document.body.addEventListener('click', bootMusic);
let retry = 0;
const retryTimer = setInterval(() => {
  if (musicBooted || !playing || ++retry > 12) { clearInterval(retryTimer); return; }
  bootMusic();
}, 500);

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

/* 回执提交 */
const attendanceEl = document.getElementById('attendance');
const countFields = document.getElementById('countFields');
attendanceEl.addEventListener('change', () => {
  countFields.style.display = attendanceEl.value === '到场' ? 'block' : 'none';
});

document.getElementById('rsvpForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const fd = new FormData(e.target);
  const name = fd.get('name').trim();
  const attendance = fd.get('attendance');
  const guest_count = attendance === '到场' ? Number(fd.get('guest_count') || 1) : 0;
  const child_count = attendance === '到场' ? Number(fd.get('child_count') || 0) : 0;
  const message = (fd.get('message') || '').trim();
  if (!name || !attendance) { toast('请填写完整信息'); return; }

  if (!cfg.supabaseUrl || cfg.supabaseUrl.includes('YOUR_')) {
    toast('后台地址未配置');
    return;
  }
  if (!cfg.supabaseKey || cfg.supabaseKey.includes('YOUR_')) {
    toast('后台密钥未配置，请上传最新 config.js');
    return;
  }

  btn.disabled = true; btn.textContent = '提交中…';
  try {
    const res = await fetch(`${cfg.supabaseUrl}/rest/v1/rsvp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': cfg.supabaseKey, 'Authorization': `Bearer ${cfg.supabaseKey}`, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ name, attendance, guest_count, child_count, message })
    });
    if (!res.ok) {
      const err = await res.text().catch(() => '');
      console.error('RSVP error', res.status, err);
      throw new Error(err || res.status);
    }
    e.target.reset(); countFields.style.display = 'none';
    toast('提交成功，感谢您的回复！');
  } catch {
    toast('提交失败，请确认 config.js 已上传到 GitHub');
  } finally {
    btn.disabled = false; btn.textContent = '确认提交';
  }
});
</script>
</body>
</html>

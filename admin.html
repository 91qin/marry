<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赴宴登记后台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f5f0eb;color:#4a3f38;min-height:100vh;padding:24px 16px 48px}
h1{font-size:20px;text-align:center;letter-spacing:3px;color:#8b1a1a;margin-bottom:6px}
.sub{text-align:center;font-size:12px;color:#9a8778;margin-bottom:28px}
.login{max-width:360px;margin:60px auto}
input{width:100%;border:1px solid #ddd;background:#fff;padding:14px;border-radius:4px;font-size:15px;margin-bottom:12px}
button{width:100%;border:0;background:#8b1a1a;color:#fff;padding:14px;border-radius:4px;font-size:15px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;max-width:520px;margin-inline:auto}
.stat{background:#fff;border-radius:6px;padding:16px 10px;text-align:center;box-shadow:0 1px 8px rgba(0,0,0,.05)}
.stat-num{font-size:28px;font-weight:600;color:#8b1a1a}
.stat-label{font-size:11px;color:#9a8778;margin-top:4px;letter-spacing:1px}
.table-wrap{max-width:520px;margin:0 auto;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.05);font-size:13px}
th{background:#8b1a1a;color:#fff;padding:10px 8px;text-align:left;font-weight:500;letter-spacing:1px}
td{padding:10px 8px;border-bottom:1px solid #f0ebe4;vertical-align:top}
tr:last-child td{border-bottom:0}
.tag-yes{color:#2d7a4f;font-weight:500}
.tag-no{color:#9a8778}
.refresh{display:block;max-width:520px;margin:16px auto 0;text-align:center;font-size:13px;color:#8b1a1a;cursor:pointer;background:none;border:none;width:100%;padding:10px}
.empty{text-align:center;padding:40px;color:#9a8778;font-size:14px}
</style>
</head>
<body>

<div id="loginView" class="login">
  <h1>赴宴登记后台</h1>
  <p class="sub">秦鸣 & 何伟丽 · 婚礼答谢宴</p>
  <input type="password" id="pwd" placeholder="请输入管理密码">
  <button onclick="doLogin()">进入查看</button>
</div>

<div id="adminView" style="display:none">
  <h1>赴宴登记统计</h1>
  <p class="sub" id="updateTime"></p>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-label">登记人数</div></div>
    <div class="stat"><div class="stat-num" id="s-guests">0</div><div class="stat-label">预计到场</div></div>
    <div class="stat"><div class="stat-num" id="s-no">0</div><div class="stat-label">无法到场</div></div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>姓名</th><th>状态</th><th>人数</th><th>留言</th><th>时间</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">暂无登记记录</div>
  </div>
  <button class="refresh" onclick="loadData()">↻ 刷新数据</button>
</div>

<script src="config.js"></script>
<script>
/*
  ===== 在 Supabase SQL Editor 中运行以下语句（只需一次）=====

  create table rsvp (
    id bigint generated always as identity primary key,
    name text not null,
    attendance text not null,
    guest_count int default 0,
    message text default '',
    created_at timestamptz default now()
  );
  alter table rsvp enable row level security;
  create policy "allow insert" on rsvp for insert with check (true);
  create policy "allow select" on rsvp for select using (true);
*/

function doLogin(){
  const cfg=window.MARRY_CONFIG||{};
  if(document.getElementById('pwd').value===cfg.adminPassword){
    document.getElementById('loginView').style.display='none';
    document.getElementById('adminView').style.display='block';
    loadData();
  }else alert('密码错误');
}
document.getElementById('pwd').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

async function loadData(){
  const cfg=window.MARRY_CONFIG||{};
  if(!cfg.supabaseUrl||cfg.supabaseUrl.includes('YOUR_')){ alert('请先在 config.js 中配置 Supabase'); return; }
  try{
    const res=await fetch(`${cfg.supabaseUrl}/rest/v1/rsvp?select=*&order=created_at.desc`,{
      headers:{'apikey':cfg.supabaseKey,'Authorization':`Bearer ${cfg.supabaseKey}`}
    });
    const rows=await res.json();
    if(!Array.isArray(rows)) throw new Error();
    document.getElementById('s-total').textContent=rows.length;
    document.getElementById('s-guests').textContent=rows.filter(r=>r.attendance==='到场').reduce((s,r)=>s+(r.guest_count||1),0);
    document.getElementById('s-no').textContent=rows.filter(r=>r.attendance==='无法到场').length;
    document.getElementById('updateTime').textContent='更新于 '+new Date().toLocaleString('zh-CN');
    const tbody=document.getElementById('tbody');
    const empty=document.getElementById('empty');
    if(!rows.length){ tbody.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display='none';
    tbody.innerHTML=rows.map(r=>`<tr>
      <td>${esc(r.name)}</td>
      <td class="${r.attendance==='到场'?'tag-yes':'tag-no'}">${esc(r.attendance)}</td>
      <td>${r.attendance==='到场'?(r.guest_count||1):'-'}</td>
      <td>${esc(r.message||'-')}</td>
      <td>${new Date(r.created_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
    </tr>`).join('');
  }catch{ alert('加载失败，请检查 config.js 配置'); }
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
